<!doctype html>
<!-- Status pill shown by src/main/status-overlay.ts. No scripts or preload: the
     main process only sets body[data-status], and CSS draws the rest. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Sotto Status</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      .pill {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 100%;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 999px;
        background: rgb(17 19 24 / 92%);
        color: #f2f4f8;
        font-size: 14px;
        font-weight: 600;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--dot);
      }
      .label::after {
        content: var(--label);
      }

      /* ---- States ---- */
      [data-status="recording"] {
        --dot: #ff4d5e;
        --label: "Recording";
      }
      [data-status="processing"] {
        --dot: #ffb648;
        --label: "Processing";
      }
      [data-status="copied"] {
        --dot: #3ddc84;
        --label: "Copied";
      }
      [data-status="no-speech"] {
        --dot: #8a91a0;
        --label: "No speech";
      }
      [data-status="failed"] {
        --dot: #ff4d5e;
        --label: "Failed";
      }
      /* Opacity-only animation stays on the compositor; Chromium stops drawing
         entirely while the window is hidden. */
      [data-status="recording"] .dot,
      [data-status="processing"] .dot {
        animation: pulse 1.2s ease-in-out infinite;
      }
      [data-status="processing"] .dot {
        animation-duration: 0.6s;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
    </style>
  </head>
  <body data-status="recording">
    <div class="pill"><span class="dot"></span><span class="label"></span></div>
  </body>
</html>
